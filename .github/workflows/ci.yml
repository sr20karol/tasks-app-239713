name: Test and Scan
on:
  push:
    branches: [main]
jobs:
  run_tests: 
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
        python-version: ["3.10", "3.11", "3.12"] # ${{matrix.python-version}}
          
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{matrix.python-version}}
    - run: pip install -r services/${{matrix.service}}/requirements.txt
    - shell: bash
      run: pytest -rA services/${{ matrix.service }} | tee ${{ matrix.service }}-test-report.txt
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ matrix.service }}-test-report
        path: ${{ matrix.service }}-test-report.txt
    - run: pip install bandit
    - run: bandit -r services/${{ matrix.service }} -f html -o ${{ matrix.service }}-bandit-report.html
      continue-on-error: true
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.service }}-bandit-report
        path: ${{ matrix.service }}-bandit-report.html
  deploy:
    needs: ["run_tests"]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download Bandit Report as Artifact
        uses: actions/checkout@v7
        with:
          name: tasks-api-3.12-bandit-report
          path: _site # _site/tasks-api-3.12-bandit-report.html
      - run: mv _site/tasks-api-3.12-bandit-report.html_site/index.html
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
      
